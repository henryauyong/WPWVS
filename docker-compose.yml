version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wpwvs-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/app/data
      - /mnt/d/Music:/app/music
      - ./backend/.env:/app/.env:ro
    # devices:
    #   - /dev/dri:/dev/dri # Optional: Enable Intel/AMD hardware acceleration for ffmpeg
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu] # Optional: Enable NVIDIA hardware acceleration for ffmpeg
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/data/db.sqlite
      - MUSIC_DIR=/app/music
      # Other variables should be in ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # User should configure VITE_API_URL in frontend/.env.production
        # We pass it to the build process if needed, or Vite will pick it up from .env.production automatically during build
        - NODE_ENV=production
    container_name: wpwvs-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
